name: Run Pytest
on:
  push:
    branches: 'main'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No pyproject.toml on purpose -- this project is g.py plus a test file.
      # Deliberately unpinned: the matrix exists partly to notice when typer or
      # rich move underneath us.
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install typer rich pytest
      - name: Run unit tests
        timeout-minutes: 10
        run: python3 -m pytest -v
