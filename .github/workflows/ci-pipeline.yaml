name: Check Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The merge that brought gwarchive into this repository; everything before it
  # is the template's history. The previous value, 9d83e69, was a commit from
  # the template's own repository and does not exist here.
  COMMITIZEN_START_REV: "8e9c1f160f2d06454e8634b4d520fb8edb1ed9a6"

jobs:
  # ---------------------------------------------------------------------------
  # Single lint job — every hook runs as its own step so failures are visible
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for commitizen rev-range

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6

      - name: check-toml
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: check-toml --all-files

      - name: Ruff (lint)
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: ruff-check --all-files

      - name: Ruff (format)
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: ruff-format --all-files

      - name: Blacken-docs
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: blacken-docs --all-files

      - name: mdformat
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: mdformat --all-files

      - name: actionlint
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: actionlint --all-files

      - name: validate-pyproject
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: validate-pyproject --all-files

      - name: yamlfmt
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: yamlfmt --all-files

      - name: cspell
        if: success() || failure()
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: cspell --all-files

      - name: Commitizen (push)
        if: (success() || failure()) && github.event_name == 'push'
        # `uv pip install` needs an activated venv, which this job does not
        # have. `uv run` makes its own, and takes commitizen from the lock.
        run: uv run --no-default-groups --group release cz check --rev-range ${{ env.COMMITIZEN_START_REV }}..HEAD

      - name: Commitizen (PR)
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: >-
          uv run --no-default-groups --group release
          cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # ---------------------------------------------------------------------------
  # Single matrix job — install once, then run pytest + docs + mypy
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # activate-environment: setup-uv v6 no longer creates and activates a venv
      # just because python-version is set, and `uv pip install` refuses to run
      # without one. It also puts .venv/bin on PATH for the bare `python` and
      # `mypy` below.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      # The extras are declared in [project.optional-dependencies]. mypy is
      # named separately because it lives in the `types` dependency group, not
      # in an extra. Unlike tests.yaml this install is NOT from uv.lock -- it
      # resolves fresh, the way a pip user's install would.
      - name: Install package with all extras
        run: uv pip install -e .[doc,lint,test] mypy

      - name: Run pytest
        run: python -m pytest

      # Skipped, not failed, while the repository has no sphinx/ tree. The
      # template's placeholder site was removed; this step picks up again as
      # soon as a sphinx/conf.py exists.
      - name: Build docs
        if: (success() || failure()) && hashFiles('sphinx/conf.py') != ''
        run: |
          cd sphinx
          make html

      - name: Run mypy
        if: (success() || failure()) && matrix.python-version == '3.13'
        # No path argument: [tool.mypy].files covers src, tests and scripts.
        run: mypy

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.13' && hashFiles('sphinx/conf.py') != ''
        with:
          name: sphinx-docs
          path: sphinx/_build/html/
          retention-days: 3
