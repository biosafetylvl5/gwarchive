# Deliberately narrower than courier's config. Its `max-complexity = 5` with
# E,F,W,I,N,D,UP,B,C4,SIM,ARG,ERA would put most of g.py's commands over the
# cap on the first run, which is how a linter becomes something people ignore.
target-version = "py311"
line-length = 110

# Ruff formats Python blocks inside Markdown. The plan documents quote the
# *old* code verbatim as evidence -- reformatting them would edit the record.
extend-exclude = ["*.md"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# B008 used to be ignored here, because `typer.Option(...)` in a default is
# Typer's whole calling convention and every command tripped it. The options
# now live in `Annotated` aliases, so there are no call-valued defaults left
# and the rule is clean -- verified with `ruff check --extend-select B008`.
#
# ERA and ARG were measured and declined. ERA001 reads a commented-out
# assignment as dead code, and the PEP 723 dependency block under the shebang
# is exactly that shape -- a rule whose only candidate finding would be the
# file's own load-bearing metadata. ARG flags seven things, all convention:
# the eager `--version` callback parameter, pytest fixtures requested for their
# side effect, and the monkeypatch stand-ins that must match `run_rclone`'s
# real signature. Seven findings, seven suppressions, nothing detected.
#
# A complexity cap is still worth having, but measure it against the current
# shape -- `verify` was never the outlier the old note here assumed.
