default_install_hook_types: [pre-commit, commit-msg]

# CHANGELOG.md is excluded from mdformat because brassy regenerates it.
#
# Since ruff 0.16.0 `ruff format` also formats python fences inside *.md, so
# README.md and AGENTS.md are covered by ruff as well as blacken-docs.
repos:
  # check-toml would have refused the commit that left merge-conflict markers
  # in pyproject.toml, which then broke every tool in the gate unnoticed.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies:
          - black==26.3.0
  - repo: https://github.com/executablebooks/mdformat
    rev: "1.0.0"
    hooks:
      - id: mdformat
        exclude: ^CHANGELOG\.md$
        additional_dependencies:
          - mdformat-gfm
          - mdformat-black
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.9.24
    hooks:
      - id: actionlint
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.24.1"
    hooks:
      - id: validate-pyproject
        # Optional extra validations from SchemaStore:
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.7.0
    hooks:
      - id: cspell
  # The commit-msg stage above. Keep rev in step with commitizen in uv.lock.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
