default_install_hook_types: [pre-commit, commit-msg]

# Two hooks are deliberately absent.
#
# `trailing-whitespace`: accepted-plan.md quotes captured terminal output whose
# trailing spaces are the evidence for findings 1.2 and 1.3.
#
# `mdformat`: measured against the plan documents, it rewrites `---` rules to
# `______`, pads every table, renumbers ordered lists to all-`1.` (the plans
# cite their own step numbers in prose), and unwraps paragraphs. `--number
# --wrap keep` stops only the renumbering. accepted-plan.md is the user's
# annotated record; a formatter must not rewrite it on commit.
#
# The ruff pin below moved v0.15.6 -> v0.16.8. That crosses a threshold: ruff
# 0.16.0 promoted Markdown formatting out of preview, so from this rev onward
# `ruff-format` WILL rewrite python fences inside *.md. Measured against this
# repo: with `.ruff.toml`'s `extend-exclude = ["*.md"]` ruff formats 1 file;
# without it, 2 more "would be reformatted" and the diff rewrites a quoted
# Optional[str] signature inside accepted-plan.md -- old code held as evidence.
# That exclude is load-bearing at this rev, not decoration. Do not remove it.
repos:
  # check-toml would have refused the commit that left merge-conflict markers
  # in pyproject.toml, which then broke every tool in the gate unnoticed.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies:
          - black==26.3.0
  - repo: https://github.com/executablebooks/mdformat
    rev: "1.0.0"
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-black
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.9.24
    hooks:
      - id: actionlint
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.24.1"
    hooks:
      - id: validate-pyproject
        # Optional extra validations from SchemaStore:
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.7.0
    hooks:
      - id: cspell
