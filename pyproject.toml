# ---------------------------------------------------------------------------
# ruff's configuration is deliberately NOT in this file.
#
# It lives in .ruff.toml, standalone, and must stay there: when .ruff.toml
# exists beside pyproject.toml, ruff reads .ruff.toml and a [tool.ruff] table
# here is ignored SILENTLY -- no error, no warning, no hint that the settings
# never took effect. .ruff.toml is also 20-odd lines of measured rationale that
# AGENTS.md cites; it reads as a design document when it is the whole file and
# as scroll-past noise in the middle of a 200-line pyproject.
#
# Knock-on: .ruff.toml cannot infer `target-version` from `requires-python`
# without a [project] table in the same file, so `py311` there and
# `requires-python = ">=3.11"` here are hand-synced. test_config_floors_agree
# parses both and asserts they match.
# ---------------------------------------------------------------------------

[build-system]
# uv.lock does NOT pin build backends -- they resolve fresh in an isolated
# build env on every `uv build`, so the floor here is the only constraint.
# 1.27 is the first release that understands PEP 639's SPDX `license` string
# and `license-files`; older ones reject the [project].license below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gwarchive"
# STATIC on purpose; do NOT convert to [tool.hatch.version]/`dynamic`.
# Two reasons, both load-bearing:
#   1. commitizen's `version_provider = "uv"` reads [project].version.
#      Hatch dynamic versioning omits that key, so the two are mutually
#      exclusive -- `cz bump` would have nothing to read.
#   2. The reflex repair for a dynamic version
#      (`__version__ = importlib.metadata.version("gwarchive")`) breaks inside
#      the g.pyz zipapp, which carries no .dist-info to look up.
# So: this key, plus a literal `__version__` in src/gwarchive/__init__.py,
# plus gwarchive's entry in uv.lock -- three copies, all written by `cz bump`.
# Never bump by hand: 1.3.0 broke the PyPI publish that way, 1.3.1 uv.lock.
version = "1.3.1"
description = "Organize folders under the GWArchive naming standard"
readme = "README.md"
requires-python = ">=3.11"

# No classifiers. The `Programming Language :: Python :: 3.x` block would be a
# fourth unenforced copy of the Python version (requires-python, .ruff.toml's
# target-version, [tool.mypy].python_version are the other three).
#
# "Private :: Do Not Upload" used to sit here: an unregistered classifier PyPI
# rejects outright, so an accidental upload failed. It was removed when the
# package started publishing through package-and-publish.yaml. Putting it back
# makes every release fail at the upload step.

# PEP 639: an SPDX expression plus the file that carries the text. Not the
# `License ::` classifier -- PEP 639 deprecates those, and the classifier set
# above is deliberately empty. LICENSE is the CC0 1.0 legal code verbatim, as
# published at creativecommons.org; do not reflow or "tidy" it.
license = "CC0-1.0"
license-files = ["LICENSE"]

# typer>=0.16.0 is a correctness floor, measured by installing each release and
# running the CLI plus the full suite, not a hygiene guess. Three stacked
# constraints, each one strictly above the last:
#   >=0.9.0   `default_factory=` inside typer.Option() exists at all.
#             0.8.0: TypeError: Option() got an unexpected keyword argument
#             'default_factory'. (Annotated support also lands in 0.9.0.)
#             NB: this is NOT the binding constraint, despite being the one
#             that is easiest to spot in the source.
#   >=0.12.4  PEP 604 `X | None` in the 13 option/argument annotations.
#             <=0.12.3: RuntimeError: Type not yet supported: str | None,
#             raised inside app() at get_click_type -- so even `--help` dies,
#             not merely the commands that use a union.
#   >=0.16.0  tolerates click>=8.2, which the tests need for CliRunner's
#             separately-captured result.stderr. 0.15.4 is the only release in
#             typer's history that hard-caps `click<8.2`; 0.12.4-0.15.3 crash on
#             click>=8.2 with
#             TypeError: Parameter.make_metavar() missing 1 required
#             positional argument: 'ctx'. 0.16.0 removed the cap.
# Verified green at 0.16.0, 0.17.4, 0.19.2, 0.21.1 and 0.27.2, against the
# suite as it stood then (191 tests). Re-measure before relying on it again.
#
# rich is an unconditional dependency of typer from 0.12 onward (the old
# `typer[all]` extra is gone), so this line is never what makes rich present.
# It is declared because gwarchive imports rich directly -- rich.box,
# rich.filesize.decimal, rich.status.Status, rich.panel.Panel -- and PEP 508
# says declare what you import. The floor is hygiene, not measurement: the
# suite is green all the way down to rich 10.11.0. Note that typer 0.27 asks
# for rich>=13.8.0 itself, which quietly wins over this line anyway.
#
# No `click` entry: typer 0.27 dropped click as a dependency entirely, so a
# floor here would install a package this tool does not import. The test leg's
# click need is declared in [dependency-groups].test instead.
#
# No upper caps anywhere. A cap in published metadata is a promise binding
# every installer forever; uv.lock is the statement about this checkout.
dependencies = [
    "typer>=0.16.0",
    "rich>=13.7",
]

# After every bare [project] key, not beside the other metadata: a table header
# ends [project], so any key written below it lands in this table instead.
[project.urls]
Repository = "https://github.com/biosafetylvl5/gwarchive"

[project.scripts]
gwarchive = "gwarchive.__main__:main"

# ---------------------------------------------------------------------------
# Extras AND dependency groups, with each list written exactly once.
#
# The extras exist for pip-shaped installs -- ci-pipeline.yaml runs
# `uv pip install -e .[doc,lint,test]`, which cannot see a dependency group.
# The groups exist for uv: `uv sync --group test` is what tests.yaml and
# static.yaml install from the lock. Extras are published metadata, so these
# appear on PyPI as `gwarchive[test]` and friends; that is the accepted cost of
# ci-pipeline.yaml and the release workflow's pre-publish tests both being able
# to `pip install` them.
#
# The lists live in the extras and the groups name them (`gwarchive[test]`).
# uv resolves that self-reference to the project, so there is one copy to edit
# and the two spellings cannot drift. Do not copy the lists into the groups.
#
# The group split keeps `release` (brassy pulls pydantic, pygit2 and
# dateparser) out of the four-leg test matrix, where it would multiply install
# time to support a job that does not run there. `doc` is in no group, `dev`
# included: sphinx is not something every `uv sync` should install.
# ---------------------------------------------------------------------------
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    # typer.testing.CliRunner only captures result.stderr separately from
    # stdout on click>=8.2, and the suite asserts on result.stderr in 46
    # places. typer>=0.16 permits click 8.2 but does not require it, so a
    # resolver is free to hand the test leg click 8.1.x -- which fails 48
    # tests with `ValueError: stderr not separately captured`. This pins the
    # leg without putting a click floor in [project].dependencies, where it
    # would install click for runtime users who no longer need it.
    "click>=8.2",
]
lint = [
    "ruff",
    "vulture",
    "typos",
]
# What ci-pipeline.yaml's docs build needs: Sphinx plus the extensions and
# theme a conf.py for this project would name.
doc = [
    "sphinx",
    "myst-parser",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
]

[dependency-groups]
test = ["gwarchive[test]"]
lint = ["gwarchive[lint]"]
types = [
    "mypy",
    # [tool.mypy].files includes "tests", and the test modules import pytest
    # and typer.testing. Without them installed, mypy reports
    # `Cannot find implementation or library stub for module named "pytest"`
    # and the types leg fails for a reason that has nothing to do with types.
    {include-group = "test"},
]
release = [
    "brassy",
    "commitizen",
]
# scripts/build_binary.py, run only by the release workflow's binary matrix.
# A group rather than `uv run --with pyinstaller` so the bundler is pinned by
# uv.lock like everything else that shapes a shipped artifact. Not in `dev`:
# nothing in the gate needs it.
binary = ["pyinstaller"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "types"},
    {include-group = "release"},
]

# ---------------------------------------------------------------------------
# hatchling
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/gwarchive"]
# py.typed needs no declaration: hatchling ships every file under `packages`.

[tool.hatch.build.targets.sdist]
# Named explicitly, and this is not tidiness. Hatchling's default sdist ships
# everything the VCS does not ignore, which here includes the repo's own
# .gwarchive-offload.json -- a real tombstone carrying a private remote host
# name in its `remotes` list. An allowlist cannot leak a file nobody listed.
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/.ruff.toml",
    "/uv.lock",
]

# ---------------------------------------------------------------------------
# mypy. Folded in from mypy.ini, which is deleted in the same commit: leaving
# both would make this table silently dead, because mypy reads mypy.ini first
# and never looks here.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unreachable = true

# New here, not carried over from mypy.ini:
#
# `files` means a bare `uv run mypy` checks the right thing, and it brings
# tests/ under disallow_untyped_defs -- which forces every monkeypatch
# stand-in to be annotated, fixing for free the signature-drift concern
# .ruff.toml raises when it declines ARG.
files = ["src", "tests", "scripts"]
# `warn_unused_ignores` catches a `# type: ignore` that its error moved out
# from under during the split. That is exactly the residue a split creates,
# and it is invisible without this.
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Valid from the commit that introduces this file: the suite is moved into
# tests/ in that same commit. Setting it while tests/ does not yet exist
# collects zero tests and makes the per-commit gate vacuous.
testpaths = ["tests"]
# --strict-markers, --strict-config: a typo in a marker or in this table is an
# error, not a silent no-op.
addopts = "--strict-markers --strict-config"
# No --import-mode=importlib. It was added for nested test directories that the
# split did not need, and under it `from conftest import run` does not resolve:
# importlib mode does not put the test directory on sys.path. Default prepend
# mode does, and it is safe here because every test basename is unique -- which
# is the only thing prepend mode actually requires.
xfail_strict = true
# Deliberately NO `pythonpath = ["src"]`. It would put src/ on sys.path
# directly, so the suite would pass even if [project] or the build backend
# config were broken and `gwarchive` were not actually installable. The tests
# import the installed package, which is the thing users get.

# ---------------------------------------------------------------------------
# commitizen
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
# Reads [project].version above -- see the note on the static version.
# "uv", not "pep621": only "uv" also updates uv.lock, which `--locked` CI checks.
version_provider = "uv"
# An anchored textual replace, so `__version__ = "0.3.0"` must stay on one
# line with no computation for this to find it.
version_files = ["src/gwarchive/__init__.py:__version__"]
# Decide this before the first tag: changing it later rewrites every tag.
tag_format = "v$version"
annotated_tag = true
# commitizen applies this at any version: true made `feat!:` on 1.3.1 a 1.4.0.
major_version_zero = false
# Release notes come from brassy, not `cz changelog`, and no changelog_* keys
# are set. This is explicit so nobody "fixes" it back on: the two answer
# different questions, and here that matters concretely -- the git history is
# being manufactured, so `cz changelog` would render "0.3.0: split g.py into
# modules, add pyproject, add CI", describing a release in which nothing
# observable changed except the command name.
update_changelog_on_bump = false

# ---------------------------------------------------------------------------
# vulture
# ---------------------------------------------------------------------------
[tool.vulture]
# 60 is the unused-FUNCTION band, and it is the only band that earns its keep.
# Measured on this codebase: 60 -> 52 findings, 80 -> 30, and every one of the
# 30 is an unused pytest-fixture *parameter* reported at 100% confidence (not
# an unused import -- there are none; ruff F401 agrees). ruff's ARG rules cover
# that band more precisely anyway: ARG001 finds 58 where vulture finds 30.
#
# Be honest about what 60 buys today: 22 findings, 22 false positives, zero
# genuinely dead functions. Its value is prospective -- it is the only tool in
# the stack that will catch a stranded helper. It ran with continue-on-error
# while the split was in flight; the split is done and static.yaml now runs it
# as a hard leg.
#
# vulture reads this table from the CURRENT WORKING DIRECTORY only -- it does
# not walk up the tree. Run from one directory below and the config is ignored
# in silence and all 52 findings come back. So: run it from the repo root, and
# `paths` is pinned here so `uv run vulture` needs no arguments at all.
min_confidence = 60
paths = ["src", "tests"]
sort_by_size = true

# fnmatch, applied to the decorator's dotted callable ONLY -- vulture strips
# the call arguments before matching, so "@app.command" matches @app.command(),
# @app.command("list") and @app.command("shell-init") alike. Do NOT write
# "@app.command()" or "@app.command(*)": both match nothing, and they fail
# SILENTLY -- no error, no warning, just zero suppression.
#
# This only works while the commands are registered with an applied decorator.
# If commands/<group>.py's `register(app)` ever switches to
# `app.command(...)(fn)`, ignore_decorators stops matching entirely and all 18
# commands fire again with no suppression available except 18 literal names --
# which on its own blows the ~10-entry kill criterion.
ignore_decorators = ["@app.command", "@app.callback", "@pytest.fixture"]

# Fixture parameters a test requests for its side effect and never reads, one
# attribute assignment onto a stdlib tarfile.TarInfo, and two members of
# monkeypatch stand-ins that exist to satisfy an external contract rather than
# to be read here: `capture_output` on the _fake_run stand-ins (it must match
# run_rclone's real signature -- .ruff.toml records the same reason for
# declining ARG), and `free` on the NoRoom class standing in for the
# shutil.disk_usage result, which production code reads as `.free`.
ignore_names = ["duplicates", "stray", "gzip_codec", "linkname", "capture_output", "free"]

# Seven suppressions for a clean run, against a ~10 kill criterion. This is
# also why there is no whitelist.py: `vulture --make-whitelist` emits 52 lines
# for the same job and must be regenerated whenever line numbers move, while
# this table is name-based and survives code motion. Verified not to blind the
# tool: with this table in force, an uncalled helper added to a module is still
# reported.

# ---------------------------------------------------------------------------
# typos. Report-only, always: never add `typos -w` and never add a typos
# pre-commit hook. `.gwarchive-offload.json`, `.gwarchive-*`, `tool_version`,
# `offloaded_at` and `member_count` are on-disk wire format. An auto-"fix" to
# one of those literals makes _reserved_member stop matching, and the next
# --no-compress push uploads the `.gwarchive-*` namespace -- a bug this tool
# has already shipped once.
# ---------------------------------------------------------------------------
[tool.typos.default.extend-identifiers]
# Measured, not predicted: a bare run over this repo is NOT clean. It reports
# exactly two findings, exit 2, both on `Alph` in the --exact find test, where
# the string is a deliberate 4-character prefix of "Alpha" whose entire purpose
# is to be a partial match that `--exact` must reject. "Correcting" it deletes
# the test.
#
# extend-identifiers, not extend-words: this matches the whole identifier and
# is case-sensitive, so a genuine future `alph` or `AlphaHelper` still fires.
# extend-words would silence all of those at once.
#
# Two lines is the whole config. The 17 domain words that looked like they
# would need an allowlist -- gwarchive, mksub, oldify, PRMAO, zstd, rclone,
# pokeget, bulbasaur, iterdir, copytree, hatchling, brassy, vulture, tombstone,
# offload, typer, pyproject -- were each run through typos in isolation, as
# real Python identifiers, and as Markdown prose. None of them fire.
#
# This table must stay in pyproject.toml alone. A _typos.toml, typos.toml or
# .typos.toml beside it does not merge -- it REPLACES this table outright, and
# the key prefix differs between the two homes (`tool.typos.` here, bare
# `default.` there), so a copied snippet silently does nothing.
Alph = "Alph"

# Hidden paths are skipped by default, and that decision is left as-is:
# .github/workflows/*.yaml, .ruff.toml, .pre-commit-config.yaml and .actrc are
# NOT spell-checked. To change that, uncomment the block below -- and note that
# `ignore-hidden = false` alone is a trap, because it makes typos read
# .git/objects/ and report on a compressed blob. The exclude is what makes it
# usable.
#
# [tool.typos.files]
# extend-exclude = [".git/"]
# ignore-hidden = false
