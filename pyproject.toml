# ---------------------------------------------------------------------------
# ruff's configuration is deliberately NOT in this file.
#
# It lives in .ruff.toml, standalone, and must stay there: when .ruff.toml
# exists beside pyproject.toml, ruff reads .ruff.toml and a [tool.ruff] table
# here is ignored SILENTLY -- no error, no warning, no hint that the settings
# never took effect. .ruff.toml is also 20-odd lines of measured rationale that
# AGENTS.md cites; it reads as a design document when it is the whole file and
# as scroll-past noise in the middle of a 200-line pyproject.
#
# Knock-on: .ruff.toml cannot infer `target-version` from `requires-python`
# without a [project] table in the same file, so `py311` there and
# `requires-python = ">=3.11"` here are hand-synced. test_config_floors_agree
# parses both and asserts they match.
# ---------------------------------------------------------------------------

[build-system]
# uv.lock does NOT pin build backends -- they resolve fresh in an isolated
# build env on every `uv build`, so the floor here is the only constraint.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gwarchive"
# STATIC on purpose; do NOT convert to [tool.hatch.version]/`dynamic`.
# Two reasons, both load-bearing:
#   1. commitizen's `version_provider = "pep621"` reads [project].version.
#      Hatch dynamic versioning omits that key, so the two are mutually
#      exclusive -- `cz bump` would have nothing to read.
#   2. The reflex repair for a dynamic version
#      (`__version__ = importlib.metadata.version("gwarchive")`) breaks inside
#      the g.pyz zipapp, which carries no .dist-info to look up.
# So: this key, plus a literal `__version__` in src/gwarchive/__init__.py,
# kept in step by [tool.commitizen].version_files. That is two declarations,
# not one, and test_version_matches_package_metadata is the guard.
version = "0.3.0"
description = "Organize folders under the GWArchive naming standard"
readme = "README.md"
requires-python = ">=3.11"

# Only this one. The `Programming Language :: Python :: 3.x` block would be a
# fourth unenforced copy of the Python version (requires-python, .ruff.toml's
# target-version, [tool.mypy].python_version are the other three), and
# "Private :: Do Not Upload" is an unregistered classifier that PyPI rejects
# outright -- an accidental `twine upload` fails instead of publishing.
classifiers = ["Private :: Do Not Upload"]

# No `license` key: the LICENSE decision is deliberately deferred, and
# declaring a license without shipping its file is a false claim.
# No [project.urls]: there is no remote yet.

# typer>=0.16.0 is a correctness floor, measured by installing each release and
# running the CLI plus the full suite, not a hygiene guess. Three stacked
# constraints, each one strictly above the last:
#   >=0.9.0   `default_factory=` inside typer.Option() exists at all.
#             0.8.0: TypeError: Option() got an unexpected keyword argument
#             'default_factory'. (Annotated support also lands in 0.9.0.)
#             NB: this is NOT the binding constraint, despite being the one
#             that is easiest to spot in the source.
#   >=0.12.4  PEP 604 `X | None` in the 13 option/argument annotations.
#             <=0.12.3: RuntimeError: Type not yet supported: str | None,
#             raised inside app() at get_click_type -- so even `--help` dies,
#             not merely the commands that use a union.
#   >=0.16.0  tolerates click>=8.2, which the tests need for CliRunner's
#             separately-captured result.stderr. 0.15.4 is the only release in
#             typer's history that hard-caps `click<8.2`; 0.12.4-0.15.3 crash on
#             click>=8.2 with
#             TypeError: Parameter.make_metavar() missing 1 required
#             positional argument: 'ctx'. 0.16.0 removed the cap.
# Verified 191/191 green at 0.16.0, 0.17.4, 0.19.2, 0.21.1 and 0.27.2.
#
# rich is an unconditional dependency of typer from 0.12 onward (the old
# `typer[all]` extra is gone), so this line is never what makes rich present.
# It is declared because gwarchive imports rich directly -- rich.box,
# rich.filesize.decimal, rich.status.Status, rich.panel.Panel -- and PEP 508
# says declare what you import. The floor is hygiene, not measurement: the
# suite is green all the way down to rich 10.11.0. Note that typer 0.27 asks
# for rich>=13.8.0 itself, which quietly wins over this line anyway.
#
# No `click` entry: typer 0.27 dropped click as a dependency entirely, so a
# floor here would install a package this tool does not import. The test leg's
# click need is declared in [dependency-groups].test instead.
#
# No upper caps anywhere. A cap in published metadata is a promise binding
# every installer forever; uv.lock is the statement about this checkout.
dependencies = [
    "typer>=0.16.0",
    "rich>=13.7",
]

[project.scripts]
gwarchive = "gwarchive.__main__:main"

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735), not extras. Extras are *published* -- they are a
# feature of the distribution someone installs. Development tooling is not.
# The split keeps `release` (brassy pulls pydantic, pygit2 and dateparser) out
# of the three-Python test matrix, where it would triple install time to
# support a job that does not run there.
# ---------------------------------------------------------------------------
[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    # typer.testing.CliRunner only captures result.stderr separately from
    # stdout on click>=8.2, and the suite asserts on result.stderr in 46
    # places. typer>=0.16 permits click 8.2 but does not require it, so a
    # resolver is free to hand the test leg click 8.1.x -- which fails 48
    # tests with `ValueError: stderr not separately captured`. This pins the
    # leg without putting a click floor in [project].dependencies, where it
    # would install click for runtime users who no longer need it.
    "click>=8.2",
]
lint = [
    "ruff",
    "vulture",
    "typos",
]
types = [
    "mypy",
    # [tool.mypy].files includes "tests", and the test modules import pytest
    # and typer.testing. Without them installed, mypy reports
    # `Cannot find implementation or library stub for module named "pytest"`
    # and the types leg fails for a reason that has nothing to do with types.
    {include-group = "test"},
]
release = [
    "brassy",
    "commitizen",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "types"},
    {include-group = "release"},
]

# ---------------------------------------------------------------------------
# hatchling
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/gwarchive"]
# py.typed needs no declaration: hatchling ships every file under `packages`.

[tool.hatch.build.targets.sdist]
# Named explicitly, and this is not tidiness. Hatchling's default sdist ships
# everything the VCS does not ignore, which here includes the repo's own
# .gwarchive-offload.json -- a real tombstone carrying a private remote host
# name in its `remotes` list. An allowlist cannot leak a file nobody listed.
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/.ruff.toml",
    "/uv.lock",
]

